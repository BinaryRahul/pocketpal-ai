apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def targetAbi = project.findProperty("targetAbi")?.toString()

def releaseStorePassword = System.getenv("APP_RELEASE_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("APP_RELEASE_KEY_PASSWORD")

android {
    namespace "com.pocketpal"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.pocketpallite"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "2.0.0"
        ndk {
            if (targetAbi) {
                abiFilters targetAbi
            } else {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStorePassword && releaseKeyPassword) {
                storeFile file("pocketpal-release-key.keystore")
                storePassword releaseStorePassword
                keyAlias "pocketpal_key_alias"
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "USE_DEV_SUPPORT", "true"
        }
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                println "Warning: Release signing credentials not found, using debug keystore"
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "USE_DEV_SUPPORT", "false"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("io.github.react-native-community:jsc-android:2026004.+")
    }
}
